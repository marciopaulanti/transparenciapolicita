# ============================================================================
# Transparência Política — stack de produção (projeto independente)
# ---------------------------------------------------------------------------
# Um contêiner só: o app (estáticos + API) na porta interna 8080.
#
# Este projeto é independente do gparla: rede Docker própria, volume próprio
# e nenhum vínculo com os outros serviços da VPS. O contêiner publica a
# porta 8080 no host, então qualquer proxy (o Caddy deste projeto, o Caddy
# de outro projeto ou um túnel) chega nele por 127.0.0.1:8080 — sem
# precisar compartilhar rede Docker com ninguém.
#
# O banco fica em volume nomeado, fora do contêiner: recriar a imagem não
# pode levar os dados junto.
# ============================================================================

services:
  transparenciapolicita:
    build:
      context: .
      dockerfile: Dockerfile
    image: transparenciapolicita:1.0.0
    container_name: transparenciapolicita
    restart: unless-stopped
    ports:
      # Publicada no host para o proxy do projeto falar com o app.
      # O proxy escuta em 127.0.0.1:8080 e é o único que chega à internet.
      - "8090:8080"
    environment:
      TP_PORT: "8080"
      # Onde o app está publicado. "/" na raiz do domínio próprio;
      # "/transparenciapolicita/" em subdiretório, se um dia fizer sentido.
      TP_BASE_PATH: "${TP_BASE_PATH:-/}"
      TP_AUDITORIA: "${TP_AUDITORIA:-1}"
      TZ: "${TZ:-America/Sao_Paulo}"
    volumes:
      - transparenciapolicita-dados:/srv/data
    networks:
      - transparenciapolicita
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  transparenciapolicita-dados:
    name: transparenciapolicita-dados

networks:
  transparenciapolicita:
    name: transparenciapolicita
