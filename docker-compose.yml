# ============================================================================
# Transparência Política — stack de produção (projeto independente)
# ---------------------------------------------------------------------------
# Dois serviços, nenhum compartilhado: o app (estáticos + API) na porta
# interna 8080 e, opcionalmente, o túnel que publica o app na internet.
#
# Este projeto é independente do gparla: rede Docker própria, volume próprio
# e nenhum vínculo com os outros serviços da VPS. O contêiner publica a
# porta 8090 no host, então qualquer proxy (o Caddy deste projeto, um proxy
# de outro projeto ou um túnel) chega nele por 127.0.0.1:8090 — sem
# precisar compartilhar rede Docker com ninguém.
#
# O banco fica em volume nomeado, fora do contêiner: recriar a imagem não
# pode levar os dados junto.
#
# O serviço "tunnel" fica atrás do perfil "tunnel" de propósito: ele só
# entra se existir ./tunnel/credentials.json (segredo que nunca vai para o
# git). Sem o arquivo, a stack sobe só o app — o proxy público continua
# podendo ser um Caddy ou um reverse proxy de terceiros.
# ============================================================================

services:
  transparenciapolicita:
    build:
      context: .
      dockerfile: Dockerfile
    image: transparenciapolicita:1.0.0
    container_name: transparenciapolicita
    restart: unless-stopped
    ports:
      # Publicada no host para o proxy do projeto falar com o app.
      # O proxy escuta em 127.0.0.1:8080 e é o único que chega à internet.
      - "8090:8080"
    environment:
      TP_PORT: "8080"
      # Onde o app está publicado. "/" na raiz do domínio próprio;
      # "/transparenciapolicita/" em subdiretório, se um dia fizer sentido.
      TP_BASE_PATH: "${TP_BASE_PATH:-/}"
      TP_AUDITORIA: "${TP_AUDITORIA:-1}"
      TZ: "${TZ:-America/Sao_Paulo}"
    volumes:
      - transparenciapolicita-dados:/srv/data
    networks:
      - transparenciapolicita
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Túnel de saída: o app não precisa de porta liberada no firewall para
  # chegar à internet. O cloudflared abre a conexão de dentro para fora e o
  # hostname público é resolvido pela borda da Cloudflare.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    container_name: transparenciapolicita-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    depends_on:
      - transparenciapolicita
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      # config.yml vem do repositório (deploy/tunnel/config.yml);
      # credentials.json é segredo e fica só na VPS.
      - ./tunnel:/etc/cloudflared:ro
    networks:
      - transparenciapolicita
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  transparenciapolicita-dados:
    name: transparenciapolicita-dados

networks:
  transparenciapolicita:
    name: transparenciapolicita
