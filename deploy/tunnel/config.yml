# ============================================================================
# Cloudflare Tunnel — Transparência Política (transparenciapolicita)
# ---------------------------------------------------------------------------
# Este arquivo vai para a VPS como ./tunnel/config.yml (o compose monta
# ./tunnel em /etc/cloudflared). O segredo do túnel fica no
# ./tunnel/credentials.json, que NUNCA entra no git.
#
# ESTE ARQUIVO É UM MODELO. O deploy/publicar-tunel.sh é quem gera a versão
# real, com o túnel e o hostname da SUA conta:
#
#   CLOUDFLARE_API_TOKEN=<token> \
#   TP_HOSTNAME=transparenciapolicita.seudominio.com.br \
#   ./deploy/publicar-tunel.sh
#
# O túnel é de saída: o cloudflared conecta de dentro para fora e a borda
# da Cloudflare entrega o tráfego. Por isso o projeto não precisa de porta
# liberada no firewall da VPS nem de IP público em porta alta.
#
# Para trocar o hostname ou o destino, edite o bloco ingress abaixo e rode
# de novo o deploy.
# ============================================================================

tunnel: <ID_DO_TUNEL>
credentials-file: /etc/cloudflared/credentials.json
no-autoupdate: true

ingress:
  # Hostname público do projeto. O registro DNS dele aponta para este
  # túnel; o app responde na rede Docker do próprio projeto.
  - hostname: <HOSTNAME>
    service: http://transparenciapolicita:8080

  # Regra de captura: qualquer outro Host cai no mesmo app.
  - service: http://transparenciapolicita:8080
